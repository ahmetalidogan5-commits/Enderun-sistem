* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.container { width: 100%; max-width: 600px; padding: 40px 20px; text-align: center; }
.profile-section { width: 150px; height: 150px; margin: 0 auto 30px; }
.profile-img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;

h1 { font-size: 2.2rem; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
.subtitle { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 40px; letter-spacing: 1px; }
.btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
.btn {
    background: white; color: #2c3e50; border: 2px solid #95a5a6;
    padding: 15px 40px; font-size: 1.1rem; font-weight: 600; border-radius: 50px;
    cursor: pointer; width: 250px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
.btn:active { transform: scale(0.95); background: #2c3e50; color: white; }
.screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;
    background: #f4f4f6; z-index: 100; transform: translateY(100%);
    transition: transform 0.6s ease; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: center;
}
.screen.active { transform: translateY(0); }
.screen-content { width: 100%; padding: 20px; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; }
.header-bar {
    width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 15px; padding-top: 10px; border-bottom: 2px solid #ddd;
    position: sticky; top: 0; background: #f4f4f6; z-index: 10;
}
.back-btn {
    background: white; border: 1px solid #ddd; padding: 8px 15px; border-radius: 20px;
    font-size: 0.9rem; color: #2c3e50; font-weight: 600; cursor: pointer;
}
.live-clock { font-size: 1.1rem; font-weight: 700; background: white; padding: 5px 15px; border-radius: 20px; }
.table-container {
    width: 100%; max-width: 1000px; background: white; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px;
}
table { width: 100%; border-collapse: collapse; text-align: center; }
th { background: #f8f9fa; color: #7f8c8d; font-weight: 600; padding: 12px 8px; font-size: 0.75rem; border-bottom: 2px solid #eee; }
td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
tr:last-child td { border-bottom: none; }
tr.active-row { background-color: #e8f4f8 !important; font-weight: 600; color: #2980b9; }
.highlight-text { color: #e74c3c; font-weight: 700; }
.bold-text { font-weight: 700; }
.group-header { background: #ecf0f1; font-weight: 700; text-align: center; padding: 10px; }
.today-header { background: #d4e6f1; color: #2980b9; }
.today-row td { background-color: #e8f4f8; font-weight: 600; color: #2980b9; }
.list-item { padding: 15px; border-bottom: 1px solid #f0f0f0; font-size: 1.1rem; font-weight: 500; text-align: center; }
.list-item:last-child { border-bottom: none; }
.footer-role { padding: 15px; background: #2c3e50; color: white; text-align: center; font-weight: 700; border-radius: 8px; width: 100%; max-width: 1000px; }
.split-table { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 1000px; }
.split-container { flex: 1; min-width: 300px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
.split-title { background: #2c3e50; color: white; padding: 10px; text-align: center; font-weight: 700; }
.version-badge {
    position: fixed; bottom: 12px; left: 12px; z-index: 300;
    background: rgba(44,62,80,0.85); color: #fff; font-size: 0.7rem; font-weight: 600;
    padding: 5px 12px; border-radius: 12px;

@media (max-width: 600px) {
    h1 { font-size: 1.8rem; }
    .profile-section { width: 120px; height: 120px; }
    td, th { padding: 8px 4px; font-size: 0.75rem; }
    .btn { width: 100%; max-width: 300px; }
    .split-table { flex-direction: column; }

function renderSchedule() {
    var tbody = document.getElementById('scheduleBody');
    tbody.innerHTML = '';
    var now = new Date();
    var currentMinutes = now.getHours() * 60 + now.getMinutes();
    for (var i = 0; i < scheduleData.length; i++) {
        var item = scheduleData[i];
        var row = document.createElement('tr');
        var sp = item.start.split(':');
        var ep = item.end.split(':');
        var startTotal = Number(sp[0]) * 60 + Number(sp[1]);
        var endTotal = Number(ep[0]) * 60 + Number(ep[1]);
        if (endTotal < startTotal) endTotal += 24 * 60;
        var checkCurrent = currentMinutes;
        if (checkCurrent < startTotal && item.title === "MECBURİ İSTİRAHAT") checkCurrent += 24 * 60;
        if (checkCurrent >= startTotal && checkCurrent < endTotal) row.className = 'active-row';
        var titleClass = item.type === 'highlight' ? 'highlight-text' : (item.type === 'bold' ? 'bold-text' : '');
        row.innerHTML = '<td>' + item.start + '</td><td>' + item.end + '</td><td class="' + titleClass + '">' + item.title + '</td>';
        tbody.appendChild(row);
    }
}
function renderYemek() {
    var gunAd = ['PAZAR', 'PAZARTESİ', 'SALI', 'ÇARŞAMBA', 'PERŞEMBE', 'CUMA', 'CUMARTESİ'];
    var bugun = gunAd[new Date().getDay()];
    var html = '<thead><tr><th colspan="3">GRUPLAR</th></tr><tr><th>1.KİŞİ (SOL)</th><th>2.KİŞİ (ORTA)</th><th>3.KİŞİ (SAĞ)</th></tr></thead><tbody>';
    for (var i = 0; i < yemekData.length; i++) {
        var g = yemekData[i];
        var isToday = (g.gun === bugun);
        html += '<tr><td colspan="3" class="group-header' + (isToday ? ' today-header' : '') + '">' + g.group + ' - ' + g.gun + (isToday ? ' (BUGÜN)' : '') + '</td></tr>';
        html += '<tr' + (isToday ? ' class="today-row"' : '') + '><td style="text-align:left; padding-left:12px;">' + g.members[0] + '</td><td>' + g.members[1] + '</td><td style="text-align:right; padding-right:12px;">' + g.members[2] + '</td></tr>';
    }
    html += '<tr><td colspan="3" class="group-header">GÖREVLİLER</td></tr><tr><th>GÖREV</th><th colspan="2">İSİM</th></tr>';
    for (var j = 0; j < rolesData.length; j++) {
        html += '<tr><td class="bold-text">' + rolesData[j].role + '</td><td colspan="2">' + rolesData[j].name + '</td></tr>';
    }
    html += '</tbody>';
    document.getElementById('yemekTable').innerHTML = html;
}
function renderCay() {
    var html = '';
    for (var i = 0; i < cayData.length; i++) html += '<div class="list-item">' + cayData[i] + '</div>';
    document.getElementById('cayList').innerHTML = html;
}
function renderKiraat() {
    var h1 = '';
    for (var i = 0; i < imamData.length; i++) h1 += '<tr><td>' + imamData[i].sira + '</td><td>' + imamData[i].name + '</td><td>' + imamData[i].sinif + '</td></tr>';
    document.getElementById('imamBody').innerHTML = h1;
    var h2 = '';

}
function renderTemizlik() {
    var html = '';
    for (var i = 0; i < temizlikData.length; i++) {
        var k = temizlikData[i];
        html += '<tr><td colspan="4" class="group-header">' + k.kat + '</td></tr>';
        for (var j = 0; j < k.rows.length; j++) {
            var r = k.rows[j];
            html += '<tr><td class="bold-text" style="text-align:left; padding-left:10px;">' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td class="bold-text">' + r[3] + '</td></tr>';
        }
    }
    document.getElementById('temizlikBody').innerHTML = html;
}
function updateClock() {
    document.getElementById('clock1').textContent = new Date().toLocaleTimeString('tr-TR');
    if (new Date().getSeconds() === 0) renderSchedule();
}
function openScreen(id) {
    document.getElementById(id).classList.add('active');
    document.getElementById(id).scrollTop = 0;
}
function closeScreen(id) {
    document.getElementById(id).classList.remove('active');
}
window.onload = function() {
    renderSchedule();
    renderYemek();
    renderCay();
    renderKiraat();
    renderTemizlik();
    setInterval(updateClock, 1000);
    updateClock();
    document.getElementById('versionBadge').textContent = 'v2.5 ✔';
};
